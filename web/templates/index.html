<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>올리브영 자동구매</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>올리브영 자동구매</h1>
  <div class="pills">
    <span class="pill" id="pill-server">서버 …</span>
    <span class="pill" id="pill-ocr">OCR …</span>
    <span class="pill" id="pill-adb">ADB …</span>
    <span class="pill" id="pill-stream">실시간 …</span>
    <div class="menu">
      <button id="menu-btn" class="hamburger" aria-label="메뉴" aria-expanded="false">☰</button>
      <nav id="menu" class="hidden">
        <a href="#main" data-view="main">작업</a>
        <a href="#log" data-view="log">실행 로그</a>
        <a href="#orders" data-view="orders">주문내역</a>
      </nav>
    </div>
  </div>
</header>

<div id="banner-unknown" class="banner danger hidden"></div>
<div id="banner-auth" class="banner warn hidden"></div>

<main id="view-main" class="view">
  <section class="card" id="sec-devices">
    <h2>기기 <button class="small" id="btn-devices">새로고침</button></h2>
    <div id="devices"></div>
    <form id="form-connect" class="inline">
      <input name="address" placeholder="무선 ADB IP:포트 (예: 192.168.0.10:5555)">
      <button type="submit">무선 연결</button>
    </form>
  </section>
  <section class="card" id="sec-new">
    <h2>작업 등록</h2>
    <p class="muted">등록만으로는 아무것도 실행되지 않습니다. 아래 작업 목록에서 <b>실행</b>을 눌러야 시작합니다.</p>
    <form id="form-run">
      <label class="wide">쓰레드 글 / 올리브영 상품 링크
        <input name="link" required placeholder="https://www.threads.com/@…/post/… 또는 https://m.oliveyoung.co.kr/…goodsNo=…">
      </label>
      <label>계정 (범위·목록)
        <input name="accounts" required placeholder="1-10 또는 1,3,5">
        <small id="acct-hint" class="muted"></small>
      </label>
      <label>결제 카드
        <select name="card"><option value="lotte">롯데카드</option><option value="hyundai">현대카드</option></select>
        <small class="muted">삼성카드는 사용하지 않습니다</small>
      </label>
      <label>옵션 번호 <input name="option" type="number" min="1" placeholder="옵션 1개면 비움"></label>
      <label>구매 수량 <input name="quantity" type="number" min="1" max="10" value="1"></label>
      <label>계정별 최대 결제금액(원) <input name="max_amount_per_account" type="number" min="0" value="0"><small class="muted">선택 · 0 = 제한 없음 · 넘으면 결제 직전 멈춤(가격 변동·포인트 미적용 대비)</small></label>
      <label>전체 최대 결제금액(원) <input name="max_total_amount" type="number" min="0" value="0"><small class="muted">선택 · 0 = 제한 없음 · 이번 작업 합계 상한</small></label>
      <label>배송지 확인 (필수)
        <input name="address_keyword" required minlength="2" placeholder="수령인 이름 또는 주소 일부 (예: 김건엽 / 역삼로 123)">
        <small class="muted">주문서 배송지에 이 글자가 없으면 결제하지 않고 멈춤</small>
      </label>
      <label>결제 인증
        <select name="pin_mode">
          <option value="auto">자동 (card_secrets.json PIN)</option>
          <option value="manual">직접 입력 (폰에서 인증 후 자동 재개)</option>
        </select>
      </label>
      <label>실행 모드
        <select name="mode">
          <option value="prepare">점검(dry-run): 결제하기 직전까지 — 결제 없음</option>
          <option value="simulate">모의 실행: 폰 없이 흐름만 — 결제 없음</option>
          <option value="pay">실제 결제</option>
        </select>
      </label>
      <label>계정 사이 쉬는 시간(초) <input name="account_delay" type="number" min="0" max="600" value="30"><small class="muted">한 계정 끝나고 다음 계정 시작 전 대기</small></label>
      <label class="check"><input type="checkbox" name="stop_on_failure" checked> 한 계정 실패 시 전체 중단</label>
      <label class="check"><input type="checkbox" name="allow_repeat"> 이미 산 계정도 다시 구매</label>
      <div class="wide actions">
        <button type="submit" class="primary">작업 등록</button>
        <span id="form-msg" class="muted"></span>
      </div>
    </form>
  </section>

  <section class="card" id="sec-runs">
    <h2>작업 <button class="small" id="btn-refresh-runs">새로고침</button></h2>
    <div id="runs"></div>
  </section>

  <section class="card" id="sec-detail">
    <h2>진행 상황 <span id="detail-title" class="muted"></span></h2>
    <div class="progress"><div id="progress-bar"></div></div>
    <div class="stats" id="detail-stats"></div>
    <div class="controls" id="detail-controls"></div>
    <table id="jobs"><thead><tr><th>#</th><th>계정</th><th>상태</th><th>현재 단계</th><th>주문번호</th><th>금액</th><th>오류·사유</th></tr></thead><tbody></tbody></table>
  </section>

  <section class="card" id="sec-unknown">
    <h2>결제 결과 확인 필요</h2>
    <p class="muted">결제 인증 뒤 완료 화면을 못 본 건입니다. 올리브영 앱의 주문내역을 확인하고 결과를 입력하세요. 확인 전까지 그 계정은 다시 결제하지 않습니다.</p>
    <div id="unknown-list" class="muted">없음</div>
  </section>





</main>

<main id="view-log" class="view hidden">
  <section class="card" id="sec-status">
    <h2>OCR·오늘 현황</h2>
    <div class="stats" id="ocr-stats"></div>
    <div class="stats" id="today-stats"></div>
  </section>
  <section class="card wide" id="sec-log">
    <h2>실행 로그 <label class="check inline"><input type="checkbox" id="log-errors"> 오류만</label></h2>
    <div id="log"></div>
  </section>
</main>

<main id="view-orders" class="view hidden">
  <section class="card" id="sec-orders">
    <h2>주문내역 <button class="small" id="btn-orders">새로고침</button></h2>
    <table id="orders"><thead><tr><th>시각</th><th>작업</th><th>계정</th><th>상태</th><th>주문번호</th><th>금액</th><th>카드</th><th>비고</th></tr></thead><tbody></tbody></table>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
